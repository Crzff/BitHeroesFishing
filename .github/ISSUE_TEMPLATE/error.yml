name: Reportar un error
description: Ayuda a reproducir un fallo sin publicar datos de tu cuenta.
title: "[Error] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "No adjuntes contraseñas, tokens, pagos, sesiones completas ni capturas sin anonimizar."
  - type: input
    id: version
    attributes:
      label: Versión del bot y Python
      placeholder: "v0.1.0-beta.1 / AUDIT-R3.15 / Python 3.13 de 64 bits"
    validations:
      required: true
  - type: input
    id: display
    attributes:
      label: Windows, resolución principal, escala, navegador y zoom
      placeholder: "Indica los valores reales de tu configuración."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducir
      description: "¿Desde qué pantalla empezaste y qué botones pulsaste?"
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Resultado esperado y resultado observado
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Fragmento mínimo de error, anonimizado
      description: "Opcional. Revisa y elimina rutas personales y datos de cuenta antes de compartir."
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacidad
      options:
        - label: "He revisado que este reporte no contenga credenciales ni datos personales."
          required: true
